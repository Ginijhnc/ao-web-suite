name: CI

on:
    pull_request:
    push:
        branches:
            - main
            - develop

env:
    NODE_VERSION: '24.21.0'

jobs:
    quality:
        name: Lint, Prettier, Typecheck, Build, Unit tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-deps
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache-version: v1

            - name: Lint
              run: pnpm lint

            - name: Prettier
              run: pnpm exec prettier --check .

            - name: Typecheck
              run: pnpm type-check

            - name: Build
              run: pnpm build

            - name: Unit Tests
              run: pnpm test
