name: CI

on:
    pull_request:
        types:
            [
                opened,
                reopened,
                synchronize,
                ready_for_review,
                converted_to_draft,
            ]

permissions:
    contents: read
    issues: write
    pull-requests: read

jobs:
    label:
        name: Label PR size
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
            pull-requests: write

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Sync PR size label
              uses: actions/github-script@v9
              with:
                  script: |
                      const issueNumber = context.payload.pull_request.number;
                      const { data: prFiles } = await github.rest.pulls.listFiles({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: issueNumber,
                        per_page: 300,
                      });

                      // Count changes excluding .json files and fixtures folders
                      let changedLines = 0;
                      for (const file of prFiles) {
                        const isJsonFile = file.filename.endsWith('.json');
                        const isFixtureFile = file.filename.includes('/fixtures/');

                        if (!isJsonFile && !isFixtureFile) {
                          changedLines += (file.additions ?? 0) + (file.deletions ?? 0);
                        }
                      }

                      const managedLabels = [
                        {
                          name: "size:S",
                          color: "0f7315",
                          description: "0-99 changed lines (excluding JSON and fixtures).",
                        },
                        {
                          name: "size:M",
                          color: "5ebd3e",
                          description: "100-399 changed lines (excluding JSON and fixtures).",
                        },
                        {
                          name: "size:L",
                          color: "fbca04",
                          description: "400-999 changed lines (excluding JSON and fixtures).",
                        },
                        {
                          name: "size:XL",
                          color: "d15328",
                          description: "1,000-1,499 changed lines (excluding JSON and fixtures).",
                        },
                        {
                          name: "size:XXL",
                          color: "b60205",
                          description: "1,500+ changed lines (excluding JSON and fixtures).",
                        },
                      ];

                      const managedLabelNames = new Set(managedLabels.map((label) => label.name));

                      const resolveSizeLabel = (totalChangedLines) => {
                        if (totalChangedLines < 100) {
                          return "size:S";
                        }

                        if (totalChangedLines < 400) {
                          return "size:M";
                        }

                        if (totalChangedLines < 1000) {
                          return "size:L";
                        }

                        if (totalChangedLines < 1500) {
                          return "size:XL";
                        }

                        return "size:XXL";
                      };

                      for (const label of managedLabels) {
                        try {
                          const { data: existing } = await github.rest.issues.getLabel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            name: label.name,
                          });

                          if (
                            existing.color !== label.color ||
                            (existing.description ?? "") !== label.description
                          ) {
                            await github.rest.issues.updateLabel({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              name: label.name,
                              color: label.color,
                              description: label.description,
                            });
                          }
                        } catch (error) {
                          if (error.status !== 404) {
                            throw error;
                          }

                          try {
                            await github.rest.issues.createLabel({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              name: label.name,
                              color: label.color,
                              description: label.description,
                            });
                          } catch (createError) {
                            if (createError.status !== 422) {
                              throw createError;
                            }
                          }
                        }
                      }

                      const nextLabelName = resolveSizeLabel(changedLines);

                      const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                        per_page: 100,
                      });

                      for (const label of currentLabels) {
                        if (!managedLabelNames.has(label.name) || label.name === nextLabelName) {
                          continue;
                        }

                        try {
                          await github.rest.issues.removeLabel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: issueNumber,
                            name: label.name,
                          });
                        } catch (removeError) {
                          if (removeError.status !== 404) {
                            throw removeError;
                          }
                        }
                      }

                      if (!currentLabels.some((label) => label.name === nextLabelName)) {
                        await github.rest.issues.addLabels({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issueNumber,
                          labels: [nextLabelName],
                        });
                      }

                      core.info(`PR #${issueNumber}: ${changedLines} changed lines (excluding JSON files and fixtures) -> ${nextLabelName}`);
