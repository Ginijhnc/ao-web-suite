name: Setup Dependencies
description: Setup Node.js and install dependencies with caching

inputs:
    node-version:
        description: Node.js version
        required: true
    cache-version:
        description: Cache version
        required: true

runs:
    using: composite

    steps:
        - name: Setup pnpm
          uses: pnpm/action-setup@v6
          with:
              run_install: false

        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
              node-version: ${{ inputs.node-version }}

        - name: Get pnpm store path
          id: pnpm-store
          shell: bash
          run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

        - name: Cache pnpm store
          id: cache-pnpm-store
          uses: actions/cache@v6
          with:
              path: ${{ steps.pnpm-store.outputs.path }}
              key: pnpm-${{ inputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ inputs.cache-version }}
              restore-keys: |
                  pnpm-${{ inputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
                  pnpm-${{ inputs.node-version }}-

        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
